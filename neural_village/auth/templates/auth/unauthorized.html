<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
    <div class="min-h-screen flex items-center justify-center">
        <div class="max-w-xl rounded-3xl bg-white p-10 shadow-2xl border border-slate-200 text-center">
            <h1 class="text-4xl font-bold text-rose-600">Access Denied</h1>
            <p class="mt-4 text-slate-600">Your account does not have permission to view this page. Please sign in with the correct role or contact support.</p>
            <a href="/auth/login/" class="mt-8 inline-flex rounded-3xl bg-teal-700 px-6 py-4 text-white font-semibold hover:bg-teal-800">Return to Login</a>
        </div>
    </div>
</body>
</html>
