<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Apply — DBBSA</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-6 bg-gray-50">
  <main class="max-w-xl mx-auto bg-white p-6 rounded shadow">
    <h1 class="text-2xl font-bold mb-4">Apply to DBBSA</h1>
    <p class="mb-4">Application fee: ₦{{ fee_ngn }} (dynamic currencies available)</p>
    <form method="post" action="{% url 'apply:initialize_application_payment' %}">
      {% csrf_token %}
      <label class="block mb-2">Email
        <input name="email" required type="email" class="w-full border p-2 rounded mt-1">
      </label>
      <label class="block mb-4">Currency
        <select name="currency" class="w-full border p-2 rounded mt-1">
          {% for cur in currencies %}
            <option value="{{ cur }}">{{ cur }}</option>
          {% endfor %}
        </select>
      </label>
      <button class="bg-amber-700 text-white px-4 py-2 rounded">Pay & Continue</button>
    </form>
  </main>
</body>
</html>
