<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}DBBSA | Brain Science Academy{% endblock %}</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- DBBSA Academic Font Stack -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,400;1,8..60,600&family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;1,300&family=EB+Garamond:ital,wght@0,400;0,500;0,700;1,400;1,700&display=swap" rel="stylesheet" />

    <style>
        /* DBBSA Global Color Variables */
        :root {
            --parchment:    #f5f0e8;
            --parchment-2:  #ede6d6;
            --ink-black:    #1a1612;
            --ink-deep:     #2a241e;
            --ink-mid:      #4a4035;
            --ink-muted:    #7a6e62;
            --burgundy:     #6b2737;
            --burgundy-pale:#f2e4e7;
            --forest-b:     #3d6653;
            --forest-pale:  #e4eeea;
            --gold-b:       #b08820;
            --rule:         rgba(26,22,18,0.12);
            --rule-strong:  rgba(26,22,18,0.22);
            --brand:        #0EA5E9;
            --brand-dark:   #0369A1;
            --brand-soft:   #E0F2FE;
            --brand-soft-2: #F0F9FF;
            --brand-bg:     #EFF8FF;
            --brand-panel:  #ffffff;
            --brand-border: rgba(14,165,233,0.16);
            --white:        #ffffff;
        }

        /* Base Typography & Background */
        body {
            font-family: 'Source Serif 4', Georgia, serif;
            background: linear-gradient(180deg, #f6fbff 0%, var(--brand-bg) 35%, var(--white) 100%);
            color: var(--ink-black);
            scroll-behavior: smooth;
            overflow-x: hidden;
            cursor: auto;
        }

        /* ── RETHEMED LEGACY CLASSES (Keeps your app from breaking) ── */
        
        /* Replaced handwriting/chalk with formal italic serif for academic emphasis */
        .font-chalk {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            letter-spacing: -0.01em;
        }

        /* Rethemed dashboard active sidebar state to academic styling */
        .sidebar-active {
            background-color: var(--brand-soft) !important;
            color: var(--brand-dark) !important;
            border-left: 3px solid var(--brand) !important;
            font-weight: 600;
        }

        /* Rethemed glass panels to look like layered parchment paper */
        .glass-panel {
            background: rgba(240, 249, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(14,165,233,0.18);
            box-shadow: 4px 6px 0 rgba(14,165,233,0.05);
            border-radius: 2px;
        }

        /* Rethemed section dividers to look like textbook margins */
        .section-divider {
            height: 1px;
            background: var(--brand-border);
        }

        /* Rethemed chalk buttons to formal academic buttons */
        .btn-chalk {
            font-family: 'Source Serif 4', serif;
            font-weight: 600;
            background: var(--brand-bg);
            border: 1px solid rgba(14,165,233,0.24);
            border-radius: 2px;
            color: var(--brand-dark);
            box-shadow: 2px 3px 0 rgba(14,165,233,0.12);
            transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
        }
        .btn-chalk:hover {
            transform: translate(-1px, -1px);
            background: var(--brand-soft);
            box-shadow: 3px 4px 0 rgba(14,165,233,0.2);
        }

        /* ── ANIMATIONS & UTILITIES ── */
        .animate-fade-up {
            animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) forwards;
        }
        .delay-100 { animation-delay: 0.1s; }
        .delay-200 { animation-delay: 0.2s; }
        
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Academic Scrollbar (Matches the theme) */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--parchment-2);
            border-left: 1px solid var(--rule);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--ink-muted);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--ink-mid);
        }

        /* Layout Helpers */
        .hidden-section { display: none !important; }
        .sidebar-transition { transition: transform 0.3s cubic-bezier(0.16,1,0.3,1); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    
    {% block extra_head %}{% endblock %}
</head>
<body class="antialiased min-h-screen flex flex-col relative">

    <!-- Main Content Area -->
    <main class="flex-grow">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Global Scripts -->
    <script>
        // Initialize Lucide Icons
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
    </script>
    
    {% block extra_scripts %}{% endblock %}
</body>
</html>
